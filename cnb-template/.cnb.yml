# mai-charts 谱面数据定时同步
#
# 数据来源：预览站（GitHub Pages）发布的 chart-preview API 快照
#   https://raincore1115.github.io/Maimai-Chart-Preview/data/chart-index.json
#   https://raincore1115.github.io/Maimai-Chart-Preview/data/analysis/*.json
#   https://raincore1115.github.io/Maimai-Chart-Preview/data/catalog.json
# （若在 CNB「密钥仓库」中配置了 CHART_PREVIEW_API_KEY 并通过 imports 引入，
#   脚本会直接调用 chart-preview API，不再依赖上面的快照。）
#
# 更新目标：
#   data/chart_analysis/{谱面}.json + _index.json   每个谱面的完整分析
#   data/chart_preview_index.json                   chart-preview API 谱面索引快照
#   data/music_data.json                            已有曲目的等级 / 谱师 / BPM / 艺术家
#   data/music_chart.json                           已有曲目的难度等级标签
#
# 三种触发方式：手动（web_trigger）、推送到 main（push）、每天 21:20 北京时间（crontab）。
# 数据提交带 [ci skip]，不会循环触发。
main:
  # 手动触发：CNB 页面 → 流水线 → 运行
  web_trigger:
    - name: 手动同步谱面数据
      docker:
        image: node:22
      stages:
        - name: 同步
          script: |
            set -e
            git config user.name "cnb-sync-bot"
            git config user.email "cnb-sync-bot@users.noreply.github.com"
            node scripts/sync-maicharts.mjs --repo-root .
        - name: 提交
          script: |
            set -e
            git add -A data/
            if git diff --cached --quiet; then echo "没有数据变更"; exit 0; fi
            git commit -m "chore(data): 从 chart-preview API 手动同步 $(date -u +%Y-%m-%dT%H:%MZ) [ci skip]"
            git push "https://${CNB_TOKEN_USER_NAME}:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git" "HEAD:${CNB_BRANCH}"

  # 推送到 main 时触发
  push:
    - name: 推送后同步谱面数据
      docker:
        image: node:22
      stages:
        - name: 同步
          script: |
            set -e
            git config user.name "cnb-sync-bot"
            git config user.email "cnb-sync-bot@users.noreply.github.com"
            node scripts/sync-maicharts.mjs --repo-root .
        - name: 提交
          script: |
            set -e
            git add -A data/
            if git diff --cached --quiet; then echo "没有数据变更"; exit 0; fi
            git commit -m "chore(data): 从 chart-preview API 增量同步 $(date -u +%Y-%m-%dT%H:%MZ) [ci skip]"
            git push "https://${CNB_TOKEN_USER_NAME}:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git" "HEAD:${CNB_BRANCH}"

  # 定时更新：每天 21:20（CNB 系统时区 Asia/Shanghai）
  "crontab: 20 21 * * *":
    - name: 定时同步谱面数据
      docker:
        image: node:22
      stages:
        - name: 同步
          script: |
            set -e
            git config user.name "cnb-sync-bot"
            git config user.email "cnb-sync-bot@users.noreply.github.com"
            node scripts/sync-maicharts.mjs --repo-root .
        - name: 提交
          script: |
            set -e
            git add -A data/
            if git diff --cached --quiet; then echo "没有数据变更"; exit 0; fi
            git commit -m "chore(data): 从 chart-preview API 增量同步 $(date -u +%Y-%m-%dT%H:%MZ) [ci skip]"
            git push "https://${CNB_TOKEN_USER_NAME}:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git" "HEAD:${CNB_BRANCH}"
